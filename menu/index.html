<a class="skip" href="#contenido" data-t="saltar">Ir a la carta</a>

<header class="hero">
  <img class="hero__foto" src="assets/img/espacio.webp" alt="" fetchpriority="high" decoding="async">
  <div class="hero__inner">
    <div class="hero__acciones">
      <button class="btn-min" id="btn-espacio" type="button" data-t="verEspacio">El espacio</button>
      <button class="btn-min" id="btn-idioma" type="button" aria-label="Switch to English">EN</button>
    </div>
    <img class="hero__colibri" src="assets/img/colibri.png" alt="" width="64" height="64" decoding="async">
    <p class="hero__lugar" data-t="heroLugar">Sector Estadio · Medellín</p>
    <h1 class="hero__nombre">Café Conexión</h1>
    <p class="hero__tag" id="tagline">Ven por el café y quédate por la conexión</p>
  </div>
</header>

<div class="barra" id="barra">
  <div class="buscador">
    <label class="skip" for="q" data-t="buscarLabel">Buscar en la carta</label>
    <input id="q" type="search" autocomplete="off" enterkeyhint="search"
           data-t-attr="placeholder:buscarPh" placeholder="Buscar un plato o un ingrediente">
  </div>

  <nav class="chips" id="chips" aria-label="Categorías"></nav>
</div>

<main id="contenido">
  <div id="destacados"></div>
  <div id="catalogo"></div>
  <p class="vacio" id="vacio" hidden data-t="sinResultados">No encontramos nada con eso. Prueba con otra palabra.</p>
</main>

<section class="espacio" id="espacio" aria-labelledby="espacio-h">
  <div class="envoltura" id="espacio-cont"></div>
</section>

<p class="pie">
  <span data-t="pieCarta">Carta actualizada el</span> <span id="pie-fecha"></span> ·
  <a href="https://instagram.com/cafeconexion8" rel="noopener" target="_blank">@cafeconexion8</a>
</p>
<button class="arriba" id="btn-arriba" type="button" data-t-attr="aria-label:arriba"
        aria-label="Volver arriba">&#8593;</button>

<dialog id="modal">
  <button class="modal__cerrar" id="modal-cerrar" type="button" aria-label="Cerrar">×</button>
  <div class="modal__cuerpo" id="modal-cuerpo"></div>
</dialog>

<script src="assets/js/carta.js?v=2" defer></script>
