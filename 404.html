/* Esta página sale en cualquier dirección que no exista, a cualquier profundidad.
   Se calcula la raíz del sitio para que estilos y enlaces funcionen igual en un dominio
   propio (raíz /) y en GitHub Pages, donde la web vive en una subcarpeta (/cafe-conexion/). */
(function (d) {
  var partes = location.pathname.split('/');
  var raiz = /\.github\.io$/.test(location.hostname) && partes.length > 2 ? '/' + partes[1] + '/' : '/';
  var base = d.createElement('base');
  base.href = raiz;
  d.head.appendChild(base);
  d.documentElement.classList.add('js');
})(document);
</script>
